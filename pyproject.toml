[project]
name = "claude-phone"
version = "0.1.0"
description = "A desk phone line between you and your Claude Code sessions"
license = "MIT"
requires-python = ">=3.12"
# tomlkit (~50 KB, pure Python): `phone config set` keeps config.toml's comments; imported only when writing it.
dependencies = ["aiohttp>=3.9", "mcp>=2.3,<3", "psutil>=5.9", "keyring>=25", "tomlkit>=0.13"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Meeting alerts from Google/Outlook calendar feeds. ~1.5 MB, pure Python; loaded only when a feed is read.
calendar = ["icalendar>=7", "recurring-ical-events>=3.8", "tzdata"]

[project.scripts]
phone = "claude_phone.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["claude_phone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
