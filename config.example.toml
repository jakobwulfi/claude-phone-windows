# Copy to %USERPROFILE%\.claude-phone\config.toml. Every key is optional; the values shown are the defaults unless
# the comment says otherwise. Keys marked [phone config] can also be changed with `phone config set <key> <value>`,
# `/claude-phone config set …` or by asking Claude; the rest only here. Then restart what reads the setting:
#   phone restart daemon       most settings
#   phone restart freeswitch   lan_ip, sip_port, esl_port, desk_ext, softphone_ext (esl_port: the daemon too)
#   phone restart whisper      whisper_server, whisper_model, whisper_language, whisper_port (the port: the daemon too)
owner_name = "Sam"      # [phone config] spoken and typed as "Sam"; the tools become call_sam and notify_sam
# autostart = true      # [phone config] on/off; start claude-phone when VS Code opens (default: only by `phone up`)
# lan_ip = "192.168.1.50"     # default: this PC's address. Pin it once the router reserves it
# lan_cidr = "192.168.1.0/24" # default: lan_ip's /24. Who may reach the phonebook and DND listener (phonebook_port)
desk_ext = "200"        # desk phone
softphone_ext = "201"   # Linphone
ring_ext = "200"        # what call_<name> rings: `phone change_phone desk|softphone` switches it
# sip_port = 5070       # with Linphone on this PC (it holds 5060); Linphone's domain is then <lan_ip>:5070
voicemail_ext = "500"
# allhands_ext = "9"    # one message to every session
# operator_ext = "0"    # say which session you want
# first_session_ext = 301   # sessions get 301-399; not 1xx (UK 101 is the police, 111 the NHS)
# last_session_ext = 399
ring_seconds = 25       # [phone config] 10-40; keep ring_seconds + record_seconds <= 90 (Claude Code's 120 s limit)
record_seconds = 60     # answers to Claude's calls
message_seconds = 300   # messages you dial in (sessions, all-hands, voicemail replies), 30-600
callerid_max = 17       # [phone config] 10-40; the T31P shows 17 characters before scrolling
# Voices are engine:name: windows (built in), piper or kokoro (free, offline, downloaded on request) or elevenlabs
# (paid; `phone voice key`); an engine alone is its default voice. `phone voice` lists them and asks before
# downloading. (Older settings such as tts_provider and sapi_voice still work, and `phone config` or `phone voice`
# rewrites them in this form.)
# voice = "windows:Microsoft Mark"            # Claude's voice; default: the Windows default voice
operator_voice = "windows:Microsoft Zira Desktop"  # dial 0
# elevenlabs_model = "eleven_turbo_v2_5"

# Speech to text
# whisper_server = 'C:\tools\whisper\Release\whisper-server.exe'  # default: whisper-server on PATH
# whisper_model = "ggml-small.en-q5_1.bin"  # ~2 s per answer on a 6-core CPU; "ggml-base.en-q5_1.bin" is ~4x faster,
#                                           # "ggml-large-v3-turbo-q5_0.bin" more accurate but ~8 s without a GPU
# whisper_language = "en"     # other languages need a multilingual model (no ".en" in its name)

# Programs and local ports
# freeswitch_exe = 'C:\Program Files\FreeSWITCH\FreeSwitchConsole.exe'
# esl_port = 8021         # FreeSWITCH's event socket, on 127.0.0.1 only
# daemon_port = 8765      # the daemon, on 127.0.0.1 only
# whisper_port = 8910     # whisper-server, on 127.0.0.1 only
# phonebook_port = 8766   # the T31P's Directory and DND key, on lan_ip (limited to lan_cidr)

# Per-repo voices
# [repo_voices]
# lemon-stand = "windows:Microsoft David Desktop"

# Per-repo ringtones, 1-5 (docs/t31p-setup.md step 14). Unlisted repos get the least-used ring on first sight.
# [repo_ringtones]
# lemon-stand = 3

# Call summaries on a Yealink desk phone's screen (docs/t31p-setup.md step 12)
# screen_push = true
# desk_ip = "192.168.1.60"  # default: the address the desk phone registered from

# Meeting alerts from your calendar's ICS feed (README: "The phone's screen and meetings").
# Store the feed's secret link first: phone calendar add google   (or outlook)
# meeting_alerts = true                # [phone config] on/off
# meeting_warn_minutes = 2             # [phone config] 1-30
# calendar_sources = ["google"]        # [phone config] "google", "outlook", or both
# calendar_refresh_minutes = 5
# calendar_email = "you@example.com"  # to skip meetings you declined; default: the calendar's name, if an address
# The whisper before a meeting, played on the speaker without ringing. "elevenlabs_v3" acts out tags like "[whispers]".
# whisper_text = "Pssst. You have a meeting."  # [phone config] up to 120 characters
# whisper_voice = "kokoro:bf_emma"  # default: Claude's voice

# Missed-call pushes to the ntfy app (README: "Missed-call pushes"). The topic is a secret: `phone push`.
# ntfy_server = "https://ntfy.sh"
# push_text = true        # include the question; false sends only who called
