name: CI

# Every push to main and every pull request runs the three test suites on Windows (claude-phone drives Windows APIs,
# so Linux runners can't stand in). The release workflow calls this one first.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (the calendar extra brings tzdata, which Windows lacks, and the libraries the diary tests use)
        run: python -m pip install -e ".[dev,calendar]"
      - name: Lint
        run: ruff check claude_phone tests
      - name: Tests
        run: pytest

  vscode-extension:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22  # `node --test` expands the "out/test/**/*.test.js" glob itself from Node 21 on
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json
      - run: npm ci
      - run: npm test

  visualstudio-extension:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Tests (the logic in ClaudePhone.Core; the extension itself needs Visual Studio to run)
        run: dotnet test visualstudio-extension/ClaudePhone.Core.Tests
